<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nolガチャ</title>
    <style>
        /* 1. 画面全体の配置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }

        .container {
            width: 95%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        #gacha-machine {
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            text-align: center;
        }

        #status {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            min-height: 2.8rem;
        }

        #result-box {
            background: #f0f2f5;
            border-radius: 20px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            padding: 20px;
            box-sizing: border-box;
        }

        #result {
            font-size: 2.0rem;
            font-weight: bold;
            margin: 0;
            width: 100%;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            word-break: break-all;
        }

        #gacha-btn {
            display: block;
            width: 100%;
            padding: 22px;
            font-size: 2rem;
            font-weight: bold;
            background-color: #ff5e78;
            color: white;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 7px 0 #d43f56;
            transition: all 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        #gacha-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        #gacha-btn:disabled {
            background-color: #ffadb9;
            box-shadow: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="container">
        <div id="gacha-machine">
            <p id="status">運試しをしよう！</p>
            <div id="result-box">
                <h1 id="result">？</h1>
            </div>
            <button id="gacha-btn">ガチャを回す</button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('gacha-btn');
        const resultDisp = document.getElementById('result');
        const statusDisp = document.getElementById('status');

        const gachaList = [
            { name: "✨️✨5,000,000nol✨✨", weight: 1 },
            { name: "✨✨プラチナ製・糸の会ロゴペンダント✨✨", weight: 1 },
            { name: "✨✨大蜘蛛弾襄 3rd 写真集『淡金』✨✨", weight: 1 },
            { name: "『民衆を導く大蜘蛛弾襄』(19世紀、油彩、カンヴァス)", weight: 1 },
            { name: "✨✨『眠れるアフロディーテ、または大蜘蛛弾襄』(17世紀？、彫刻、大理石)✨✨", weight: 1 },
            { name: "✨3,000,000nol✨", weight: 3 },
            { name: "✨1,000,000nol✨", weight: 5 },
            { name: "✨500,000nol✨", weight: 7 },
            { name: "大蜘蛛タワー内・新施設作成チケット", weight: 1 },
            { name: "サードアイサングラス(UVカット、フランス製)", weight: 3 },
            { name: "✨️大蜘蛛私室見学チケット✨", weight: 2 },
            { name: "乗れる！担げる！アサクサ神輿", weight: 2 },
            { name: "✨10倍ガチャチケット3回分✨", weight: 3 },
            { name: "100,000nol", weight: 5 },
            { name: "✨人工ダイヤモンドパール✨", weight: 2 },
 { name: "光る！喋る！超合金ヒプノシスマイクDX(自分のマイク以外)", weight: 1 },
{ name: "旬の果物詰め合わせ(メロン、マンゴー等、任意)", weight: 1 },
{ name: "✨✨漫画偉人伝〜大蜘蛛弾襄〜✨✨", weight: 3 },
            { name: "✨漫画偉人伝〜亀田真二郎〜✨", weight: 1 },
{ name: "✨漫画偉人伝〜植木豪〜✨", weight: 1 },
            { name: "電動自転車(チャイルドシート付き)", weight: 2 },
            { name: "若鮎づくしの和食ランチコース", weight: 2 },
            { name: "✨プレミア付きテレホンカード大蜘蛛弾襄(未使用)✨", weight: 3 },
            { name: "絶品！鱧フルコース", weight: 2 },
            { name: "✨スワ○フスキー社製・糸の会ロゴレリーフレリーフ✨", weight: 3 },
            { name: "美白スキンケアセット(超高級ライン)", weight: 2 },
            { name: "天体望遠鏡", weight: 1 },
            { name: "屋外BBQセット 1 式", weight: 1 },
{ name: "ガムシロップ1ガロン", weight: 1 },
 { name: "配膳ロボット猫ちゃん(言葉を覚えます)", weight: 1 },
            { name: "エアジョーダン(スニーカー)", weight: 2 },
            { name: "スタイリッシュな扇風機(Dys○n製)", weight: 1 },
            { name: "50,000nol", weight: 6 },
            { name: "10,000nol", weight: 3 },
            { name: "✨️楽園の糸5箱✨️", weight: 4 },
            { name: "かんたんキャンプファイヤーセット", weight: 5 },
            { name: "おしりセレブ(4ロール/ダブル)×9", weight: 13 },
            { name: "鼻セレブPremium(3箱)×6", weight: 13 },
        ];

        btn.onclick = function() {
            btn.disabled = true;
            statusDisp.innerText = "抽選中...";
            resultDisp.innerText = "⏳";

            const shuffle = setInterval(() => {
                resultDisp.innerText = gachaList[Math.floor(Math.random() * gachaList.length)].name;
            }, 50);

            setTimeout(() => {
                clearInterval(shuffle);

                const totalWeight = gachaList.reduce((sum, item) => sum + item.weight, 0);
                let randomNum = Math.random() * totalWeight;
                
                let selectedItem = gachaList[gachaList.length - 1];
                for (const item of gachaList) {
                    if (randomNum < item.weight) {
                        selectedItem = item;
                        break;
                    }
                    randomNum -= item.weight;
                }

                resultDisp.innerText = selectedItem.name;
                statusDisp.innerText = "結果発表！";

                if (selectedItem.name.includes("✨")) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                }

                btn.disabled = false;
            }, 1500);
        };
    </script>
</body>
</html>
