<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nolガチャ</title>
    <style>
        /* 1. 画面全体の配置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }

        .container {
            width: 95%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        #gacha-machine {
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            text-align: center;
        }

        #status {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            min-height: 2.8rem;
        }

        #result-box {
            background: #f0f2f5;
            border-radius: 20px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            padding: 20px;
            box-sizing: border-box;
        }

        #result {
            font-size: 2.0rem;
            font-weight: bold;
            margin: 0;
            width: 100%;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            word-break: break-all;
        }

        #gacha-btn {
            display: block;
            width: 100%;
            padding: 22px;
            font-size: 2rem;
            font-weight: bold;
            background-color: #ff5e78;
            color: white;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 7px 0 #d43f56;
            transition: all 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        #gacha-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        #gacha-btn:disabled {
            background-color: #ffadb9;
            box-shadow: none;
        }
    </style>
      <script>
        const btn = document.getElementById('gacha-btn');
        const resultDisp = document.getElementById('result');
        const statusDisp = document.getElementById('status');

        const gachaList = [
            { name: "✨️✨5,000,000nol✨✨", weight: 1 },
            { name: "24K糸の会ロゴペンダント", weight: 1 },
            { name: "✨✨大蜘蛛弾襄 1st 写真集『白絹』✨✨", weight: 1 },
            { name: "✨✨大蜘蛛弾襄 2nd 写真集『綺羅』✨✨", weight: 1 },
            { name: "大蜘蛛弾襄肖像画(油彩、カンヴァス)", weight: 1 },
            { name: "✨✨大蜘蛛弾襄黄金像(1/6)✨✨", weight: 1 },
            { name: "✨3,000,000nol✨", weight: 3 },
            { name: "✨1,000,000nol✨", weight: 5 },
            { name: "✨500,000nol✨", weight: 7 },
            { name: "国産天然木製ガラポン抽選機", weight: 2 },
            { name: "三大和牛食べ比べセット(神戸牛、近江牛、松阪牛)", weight: 2 },
            { name: "✨️「本日の教祖」たすき✨️(使用すると24時間大蜘蛛と同じ髪型になり権力が得られる)", weight: 2 },
            { name: "【NoDe 'β' 】遊覧ヘリコプターチケット(1名)", weight: 2 }, // 修正箇所
            { name: "✨10倍ガチャチケット3回分✨", weight: 3 },
            { name: "100,000nol", weight: 5 },
            { name: "✨合成ダイヤモンドパール✨", weight: 5 },
            { name: "漫画キョウトの歴史(全巻セット)", weight: 2 },
            { name: "電動自転車(チャイルドシート付き)", weight: 2 },
            { name: "お菓子の家(4畳半)", weight: 2 },
            { name: "大蜘蛛タワー内レストランお食事券", weight: 3 },
            { name: "活き伊勢1kg×3尾", weight: 2 },
            { name: "✨スワ○フスキー社製大蜘蛛弾襄レリーフ✨", weight: 3 },
            { name: "絶対に絹髪を生むシャンプー&トリートメント", weight: 2 },
            { name: "素晴らしい袖(左右セット)", weight: 1 },
            { name: "キャンプ(テント一式等)セット", weight: 1 },
            { name: "アサクサの木札(任意の文字)", weight: 6 },
            { name: "【NoDe 'β' 】内クルージングチケット(1名)", weight: 2 }, // 修正箇所
            { name: "50,000nol", weight: 6 },
            { name: "10,000nol", weight: 3 },
            { name: "✨️楽園の糸5箱✨️", weight: 1 },
            { name: "かんたんキャンプファイヤーセット", weight: 8 },
            { name: "おしりセレブ(4ロール/ダブル)×9", weight: 12 },
            { name: "鼻セレブPremium(3箱)×6", weight: 12 },
        ];

        btn.onclick = function() {
            btn.disabled = true;
            statusDisp.innerText = "抽選中...";
            resultDisp.innerText = "⏳";

            const shuffle = setInterval(() => {
                resultDisp.innerText = gachaList[Math.floor(Math.random() * gachaList.length)].name;
            }, 50);

            setTimeout(() => {
                clearInterval(shuffle);

                const totalWeight = gachaList.reduce((sum, item) => sum + item.weight, 0);
                let randomNum = Math.random() * totalWeight;
                
                let selectedItem = gachaList[gachaList.length - 1];
                for (const item of gachaList) {
                    if (randomNum < item.weight) {
                        selectedItem = item;
                        break;
                    }
                    randomNum -= item.weight;
                }

                resultDisp.innerText = selectedItem.name;
                statusDisp.innerText = "結果発表！";

                // 演出条件：名前に「✨」が含まれていたら紙吹雪を出す
                if (selectedItem.name.includes("✨")) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                }

                btn.disabled = false;
            }, 1500);
        };
    </script>
</body>
</html>
